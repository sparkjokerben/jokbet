[package]
name = "jokbet"
version = "0.0.1"
description = "A lightweight desktop pet that counts your keyboard and mouse activity"
authors = ["sparkjokerben"]
license = "GPL-3.0-only"
repository = "https://github.com/sparkjokerben/jokbet"
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (cargo#8519 on Windows).
name = "jokbet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
sys-locale = "0.3"
crossbeam-channel = "0.5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["record", "randr"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# For NSRect, which msg_send! can pass as a CGRect.
objc2-foundation = { version = "0.3", default-features = false, features = ["NSGeometry"] }
