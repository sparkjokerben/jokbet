# Cloudflare Workers configuration for the site.
#
# The project is a Worker (not Pages): the Git-connected build runs
# `npx wrangler deploy`, the static site in site/ is uploaded as assets, and
# worker/index.ts answers the paths that need the R2 bucket. `npm run site:dev`
# runs the same thing locally.
#
# The file is the source of truth for the name and the bindings: renaming the
# Worker here renames the deployment.

name = "jokbet-site"
# Bump this to a newer date when convenient; it only pins runtime defaults.
compatibility_date = "2026-01-01"
main = "worker/index.ts"

# Everything in site/ is published as-is (there is no build step). Files listed
# in site/.assetsignore are left out of the upload.
[assets]
directory = "site"
binding = "ASSETS"
# A path that matches no file and is not the Worker's gets site/404.html, with
# a 404 status.
not_found_handling = "404-page"
# The Worker's two namespaces, and it has to go first on them: a *navigation*
# that matches no file is answered by the assets layer's 404 page without the
# Worker ever running, and a browser makes a download a navigation. That only
# shows up in a browser — curl and fetch are not navigations — so test /dl/ in
# one. Everything else is served by the assets layer without waking the Worker.
#
# Keep the pages out of this list: the assets layer serves /changelog from
# changelog.html by itself, and a Worker asking for changelog.html by name would
# meet the _redirects rule that points the other way — a redirect loop.
run_worker_first = ["/api/*", "/dl/*"]

# Every release file and the three manifests; /dl/ and /api/ are the only way in.
[[r2_buckets]]
binding = "DOWNLOADS"
bucket_name = "jokbet-downloads"
