# Keeps the actions the workflows use up to date: one pull request a month,
# with every update in it, which CI then checks like any other.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # v1 writes GitHub API addresses into latest.json and puts the version in
      # the macOS updater bundles' names; scripts/site-manifest.ts expects
      # releases/download/ links and the old names, so the move needs both.
      - dependency-name: tauri-apps/tauri-action
        update-types: ["version-update:semver-major"]
