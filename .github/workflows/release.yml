name: Release

# Push a tag like v0.1.0 (matching package.json) to build every platform into
# a draft GitHub release. Publish the draft to ship it to the auto-updater.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - os: windows-latest
            target: ""
            args: ""
          - os: ubuntu-22.04
            target: ""
            args: --bundles appimage,deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches package.json
        shell: bash
        run: |
          version="v$(node -p 'require("./package.json").version')"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json $version"
            exit 1
          fi

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - run: npm ci

      - name: Import macOS signing certificate
        if: runner.os == 'macOS'
        env:
          P12: ${{ secrets.MACOS_SELFSIGN_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_SELFSIGN_P12_PASSWORD }}
        run: |
          # Signing every release with the same self-signed identity keeps the
          # app's designated requirement stable, so macOS keeps the Input
          # Monitoring grant across updates. Falls back to ad-hoc signing.
          identity="-"
          name="Jokbet Self-Signed"
          if [ -n "$P12" ]; then
            kc="$RUNNER_TEMP/signing.keychain-db"
            kcp="$(openssl rand -hex 16)"
            security create-keychain -p "$kcp" "$kc"
            security set-keychain-settings -lut 21600 "$kc"
            security unlock-keychain -p "$kcp" "$kc"
            echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -f pkcs12 -k "$kc"
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcp" "$kc" > /dev/null
            security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
            security find-certificate -c "$name" -p "$kc" > "$RUNNER_TEMP/cert.pem"
            sudo security add-trusted-cert -d -r trustRoot -p codeSign \
              -k /Library/Keychains/System.keychain "$RUNNER_TEMP/cert.pem" || true
            if security find-identity -v -p codesigning "$kc" | grep -q "$name"; then
              identity="$name"
            else
              echo "::warning::self-signed identity is not usable; falling back to ad-hoc signing"
            fi
          fi
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Jokbet ${{ github.ref_name }}
          releaseBody: |
            Unofficial fan project, not affiliated with Anthropic. Builds are not notarized or code-signed by a trusted authority.
            非官方同人作品，与 Anthropic 无关。安装包未经官方签名，首次打开的步骤见[下载页](https://jokbet.jokerben.top/download#install)。

            See the [download page](https://jokbet.jokerben.top/download#install) for install steps.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Zip the macOS app
        if: runner.os == 'macOS'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The same signed Jokbet.app the disk image holds, zipped. Gatekeeper
          # stops a downloaded disk image when it is opened and then the app in
          # it; out of a zip, only the app.
          version="$(node -p 'require("./package.json").version')"
          case "${{ matrix.target }}" in
            aarch64-*) arch=aarch64 ;;
            *) arch=x64 ;;
          esac
          app="src-tauri/target/${{ matrix.target }}/release/bundle/macos/Jokbet.app"
          zip="$RUNNER_TEMP/Jokbet_${version}_${arch}.app.zip"
          codesign --verify --strict "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$zip"
          gh release upload "$GITHUB_REF_NAME" "$zip" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Zip the portable Windows app
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # The exe the installer holds, with portable.txt beside it: that file
          # is what makes the app keep its data in a folder next to the exe and
          # update by replacing the exe. The zip is signed like the installers
          # are, so the updater can check it; the portable-update job below
          # adds it to latest.json.
          version="$(node -p 'require("./package.json").version')"
          zip="Jokbet_${version}_x64-portable.zip"
          mkdir -p portable/Jokbet
          cp src-tauri/target/release/jokbet.exe portable/Jokbet/Jokbet.exe
          printf '%s\r\n' \
            "This file makes Jokbet portable: its counts, settings and logs stay in the" \
            "data folder beside it, and an update replaces Jokbet.exe in place." \
            "Delete this file to use the installed app's folders instead." \
            "" \
            "这个文件让 Jokbet 以便携模式运行：统计、设置和日志都保存在旁边的 data 文件夹里，" \
            "更新时直接替换 Jokbet.exe。删掉这个文件则改用安装版的数据位置。" \
            > portable/Jokbet/portable.txt
          (cd portable && 7z a -tzip "../$zip" Jokbet)
          npx tauri signer sign "$zip"
          gh release upload "$GITHUB_REF_NAME" "$zip" "$zip.sig" --repo "$GITHUB_REPOSITORY" --clobber

  portable-update:
    # tauri-action writes latest.json for the installers, each build job adding
    # its own; the portable zip goes in once they all have, so no job's copy
    # overwrites it.
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Add the portable zip to latest.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir assets \
            --pattern latest.json --pattern "Jokbet_${version}_x64-portable.zip*"
          node scripts/make-manifest.ts portable --tag "$GITHUB_REF_NAME" --dir assets --out assets/latest.json
          gh release upload "$GITHUB_REF_NAME" assets/latest.json --repo "$GITHUB_REPOSITORY" --clobber
